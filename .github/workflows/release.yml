name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cuda: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cuda: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Install CUDA toolkit
        if: matrix.cuda
        uses: Jimver/cuda-toolkit@v0.2.25
        with:
          cuda: "12.6.3"
          method: network
          sub-packages: '["nvcc", "cudart-dev", "cublas-dev"]'

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build bundled whisper-cli
        env:
          WHISPER_CPP_REF: v1.8.3
        run: |
          git clone --depth 1 --branch "${WHISPER_CPP_REF}" https://github.com/ggml-org/whisper.cpp.git whispercpp-src
          cmake_flags="-DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_TESTS=OFF"
          if [ "${{ matrix.cuda }}" = "true" ]; then
            cmake_flags="${cmake_flags} -DGGML_CUDA=ON"
          fi
          cmake -S whispercpp-src -B whispercpp-src/build ${cmake_flags}
          cmake --build whispercpp-src/build --config Release --target whisper-cli -j"$(nproc)"
          WHISPER_CLI_PATH="$(find whispercpp-src/build -type f -name whisper-cli | head -n 1)"
          test -n "${WHISPER_CLI_PATH}"
          install -m 0755 "${WHISPER_CLI_PATH}" "./whisper-cli"

      - name: Package artifact
        run: |
          target="${{ matrix.target }}"
          suffix=""
          if [ "${{ matrix.cuda }}" = "true" ]; then
            suffix="-cuda"
          fi
          artifact="whisperx-${target}${suffix}.tar.gz"
          mkdir -p package
          install -m 0755 "target/${target}/release/whisperx" "package/whisperx"
          install -m 0755 "./whisper-cli" "package/whisper-cli"
          find whispercpp-src/build \( -type f -o -type l \) \( -name 'libwhisper.so*' -o -name 'libggml*.so*' \) -print -exec install -m 0644 {} package/ \;
          tar -czf "${artifact}" -C package .

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${artifact}" > "${artifact}.sha256"
          else
            shasum -a 256 "${artifact}" > "${artifact}.sha256"
          fi

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}${{ matrix.cuda && '-cuda' || '' }}
          path: |
            whisperx-${{ matrix.target }}${{ matrix.cuda && '-cuda' || '' }}.tar.gz
            whisperx-${{ matrix.target }}${{ matrix.cuda && '-cuda' || '' }}.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums bundle
        run: cat dist/*.sha256 > dist/checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/checksums.txt

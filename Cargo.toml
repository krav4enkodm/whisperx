[package]
name = "whisperx"
version = "0.1.5"
edition = "2024"
description = "A DX-first CLI wrapper around whisper.cpp"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
hex = "0.4"
indicatif = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.15"
toml = "0.8"
wait-timeout = "0.2"
which = "8.0"
ctrlc = "3.4"
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }

[dev-dependencies]
pretty_assertions = "1.4"
